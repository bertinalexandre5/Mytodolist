<section class="card">
  <div class="card-header">
    <h2 [class.done]="completed()">{{ list().name }}</h2>
    @if (list().tasks.length > 0) {
      <span class="count">{{ doneCount() }} / {{ list().tasks.length }}</span>
    }    <button
      type="button"
      class="delete"
      title="Supprimer la liste"
      aria-label="Supprimer la liste"
      (click)="deleteList.emit()"
    >
      ✕
    </button>
  </div>

  <ul>
    @for (task of list().tasks; track task.id) {
      <li>
        <label [class.done]="task.done">
          <input type="checkbox" [checked]="task.done" (change)="toggleTask.emit(task)" />
          {{ task.title }}
        </label>
        <button
          type="button"
          class="delete"
          title="Supprimer la tâche"
          aria-label="Supprimer la tâche"
          (click)="deleteTask.emit(task)"
        >
          ✕
        </button>
      </li>
    } @empty {
      <li class="empty">Aucune tâche pour l'instant.</li>
    }
  </ul>

  <form class="new-task" (ngSubmit)="submitTask()">
    <input
      type="text"
      class="field"
      name="title"
      placeholder="Nouvelle tâche"
      aria-label="Nouvelle tâche"
      maxlength="200"
      [(ngModel)]="newTaskTitle"
    />
    <button type="submit" class="button" [disabled]="!newTaskTitle().trim()">Ajouter</button>
  </form>
</section>
